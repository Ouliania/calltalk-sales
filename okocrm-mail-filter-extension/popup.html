<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>OkoCRM Mail Filter</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #ffffff;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 600;
    }

    .row-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 16px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .15s;
      border-radius: 16px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .15s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #6366f1; }
    input:checked + .slider:before { transform: translateX(14px); }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
      background: #ffffff;
    }

    .btn-save {
      width: 100%;
      margin-top: 10px;
      padding: 7px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-save:hover {
      background: #4f46e5;
    }

    .status-msg {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      color: #059669;
      display: none;
    }

    .tip {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.35;
      background: #f8fafc;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 3px solid #6366f1;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️ Фильтр почты OkoCRM</span>
  </div>

  <div class="row-toggle">
    <span>Скрывать прогрев Trigga</span>
    <label class="switch">
      <input type="checkbox" id="toggle-filter" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">
    <span>Коды прогрева Trigga:</span>
    <span id="code-count">0 кодов</span>
  </div>
  <textarea id="codes-input" rows="8" placeholder="icKKRxR&#10;9mBA4U0..."></textarea>

  <button class="btn-save" id="btn-save">Сохранить</button>
  <div class="status-msg" id="status-msg">✓ Коды сохранены и применены!</div>

  <div class="tip">
    Фильтрация идет строго по этим кодам. Реальные письма клиентов никогда случайно не скроются.
  </div>

  <script src="popup.js"></script>
</body>
</html>
