name: КП v3 — валидатор и негативные тесты

on:
  pull_request:
    paths:
      - "templates/kp-v3/**"
      - ".github/workflows/kp-v3-validator.yml"
  push:
    branches: [main]
    paths:
      - "templates/kp-v3/**"
      - ".github/workflows/kp-v3-validator.yml"
  workflow_dispatch:

jobs:
  kp-v3-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Компиляция
        run: python -m py_compile templates/kp-v3/validate_kp_v3.py
      - name: Проверка эталона
        run: python templates/kp-v3/validate_kp_v3.py --template templates/kp-v3/CALL-TALK_Эталон_КП_9_слайдов_v3.html
      - name: Позитивные и негативные тесты
        run: python -m unittest discover -s templates/kp-v3 -p "test_*.py" -v
